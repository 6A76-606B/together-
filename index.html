<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Together</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b1d86">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3eefb; --ink:#241a3d; --card:#ffffff; --line:#d9cdf0; --btn:#241a3d; --btnInk:#fff;
  --glow1:#ffd1e8; --glow2:#c8e7ff;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0f0a1f; --ink:#f4ecff; --card:#1b1433; --line:#3a2d63; --btn:#f4ecff; --btnInk:#1b1433;
  --glow1:#4a1d6b; --glow2:#143a6b;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 15% 10%,var(--glow1),transparent 45%),radial-gradient(circle at 90% 95%,var(--glow2),transparent 45%)}
button{font-family:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #ff5fa2;outline-offset:3px}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;
  padding-top:calc(24px + var(--safeT));padding-bottom:calc(24px + var(--safeB))}
#login.hide{display:none}
.logo{font-family:'Lalezar',sans-serif;font-size:clamp(56px,16vw,110px);line-height:1;text-align:center;
  background:linear-gradient(120deg,#ff3d81,#ffb02e 45%,#21d4a4);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(36,26,61,.12))}
.sub{font-weight:700;opacity:.7;text-align:center}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.floaters span{position:absolute;font-family:'Lalezar';opacity:.13;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(8deg)}}
.gbtn{display:flex;align-items:center;gap:14px;background:#fff;color:#2b2b2b;font-weight:900;font-size:19px;
  padding:16px 28px;border-radius:18px;box-shadow:0 6px 0 #cfc3e6,0 14px 30px rgba(36,26,61,.18);transition:transform .12s,box-shadow .12s}
.gbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #cfc3e6,0 4px 10px rgba(36,26,61,.18)}
.gbtn svg{width:26px;height:26px}

/* ---------- HOME ---------- */
#home{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;gap:12px;padding:12px;
  padding-top:calc(12px + var(--safeT));padding-bottom:calc(12px + var(--safeB))}
#home.show{display:flex}
.bar{display:flex;gap:10px;height:56px;flex:none}
.admin{flex:1;background:var(--btn);color:var(--btnInk);border-radius:16px;font-weight:900;font-size:18px;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 var(--line);transition:transform .12s,box-shadow .12s}
.theme{width:56px;background:var(--card);color:var(--ink);border-radius:16px;border:2px solid var(--line);display:grid;place-items:center;box-shadow:0 5px 0 var(--line);transition:transform .12s,box-shadow .12s}
.admin:active,.theme:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.theme svg,.admin svg{width:26px;height:26px}
.theme .moon{display:none}
:root[data-theme="dark"] .theme .sun{display:none}
:root[data-theme="dark"] .theme .moon{display:block}

.games{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.tile{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:26px;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(18px,5vw,48px);color:#fff;text-align:right;isolation:isolate;
  box-shadow:0 8px 0 rgba(0,0,0,.22),0 18px 36px rgba(0,0,0,.2);transition:transform .15s,box-shadow .15s}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.22),0 6px 14px rgba(0,0,0,.2)}
.tile .txt{position:relative;z-index:2}
.tile h2{font-family:'Lalezar',sans-serif;font-weight:400;font-size:clamp(34px,9vw,60px);line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.tile p{font-weight:700;font-size:clamp(14px,3.6vw,19px);opacity:.92;margin-top:6px}
.tile .art{position:relative;z-index:2;height:78%;aspect-ratio:1;flex:none}
.tile .art svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.tile::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;box-shadow:inset 0 0 0 3px rgba(255,255,255,.22);pointer-events:none}

/* spy */
.spy{background:radial-gradient(circle at 78% 50%,#6a4cff 0,transparent 50%),linear-gradient(135deg,#1c1250,#3b1d86 60%,#5a2ba8)}
.spy::before{content:"";position:absolute;z-index:0;width:140%;height:60%;left:-20%;top:20%;
  background:repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 2px,transparent 2px 26px);transform:rotate(-8deg)}
.spy .art{animation:sneak 4.5s ease-in-out infinite}
@keyframes sneak{50%{transform:translateX(-10px) rotate(-4deg)}}
/* words */
.words{background:radial-gradient(circle at 20% 90%,#ffd23f 0,transparent 45%),linear-gradient(135deg,#ff7a1a,#ff3d6e)}
.words .letters{position:absolute;inset:0;z-index:0}
.words .letters b{position:absolute;font-family:'Lalezar';font-weight:400;color:rgba(255,255,255,.16);animation:fl 7s ease-in-out infinite}
/* xo */
.xo{background:radial-gradient(circle at 85% 20%,#7cffd8 0,transparent 45%),linear-gradient(135deg,#0aa7a0,#1e6bd6)}
.xo .art svg .pop{transform-box:fill-box;transform-origin:center;animation:pop 3s ease-in-out infinite}
.xo .art svg .pop:nth-of-type(2n){animation-delay:.5s}
.xo .art svg .pop:nth-of-type(3n){animation-delay:1s}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(28px + var(--safeB));transform:translate(-50%,30px);opacity:0;z-index:20;
  background:var(--btn);color:var(--btnInk);font-weight:900;padding:12px 22px;border-radius:14px;transition:.3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- XO ---------- */
#xo,#wo{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;padding-top:var(--safeT);
  background:radial-gradient(circle at 90% 0,rgba(15,181,168,.22),transparent 40%),radial-gradient(circle at 0 100%,rgba(30,139,255,.2),transparent 45%),var(--bg)}
#xo.show,#wo.show{display:flex}
.xh{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.xh b{flex:1;font-family:'Lalezar';font-weight:400;font-size:26px}
.xi{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center}
.xi svg{width:22px;height:22px}
#xCode,#wCode{font:900 15px/1 'Cairo';direction:ltr;letter-spacing:.2em;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
#xCode:empty,#wCode:empty{display:none}
#xBody,#wBody{flex:1;overflow:auto;padding:16px 14px calc(24px + var(--safeB));width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(36,26,61,.07)}
.btn{background:linear-gradient(135deg,#0fb5a8,#1e8bff);color:#fff;font-weight:900;font-size:17px;padding:14px 22px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:.12s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.red{background:linear-gradient(135deg,#ff5f6d,#ff3d81)}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:900;flex:none;box-shadow:0 0 0 2px var(--line)}
.av.ph{background:var(--bg);color:var(--ink);box-shadow:0 0 0 2px var(--line);border:2px dashed var(--line)}
.me{display:flex;align-items:center;gap:12px;font-weight:900;font-size:18px}
.me small{display:block;font-weight:700;opacity:.6;font-size:13px}
.big{display:flex;align-items:center;gap:16px;width:100%;padding:24px 20px;border-radius:22px;color:#fff;text-align:right;font-family:'Lalezar';font-size:30px;box-shadow:0 7px 0 rgba(0,0,0,.2);transition:.12s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.big small{display:block;font:700 14px 'Cairo';opacity:.9}
.big svg{width:44px;height:44px;flex:none;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.big.c{background:linear-gradient(135deg,#0fb5a8,#1e8bff)}.big.j{background:linear-gradient(135deg,#ff7a1a,#ff3d81)}
.codecard{display:flex;align-items:center;gap:12px}
.code{flex:1;font:400 40px/1 'Lalezar';letter-spacing:.18em;direction:ltr;text-align:center;padding-inline-start:.18em}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:900}
.chip{background:var(--bg);padding:2px 12px;border-radius:99px;font-weight:900}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--bg);font-weight:700;font-size:13px;text-align:center;word-break:break-word}
.pc small{opacity:.6;font-size:11px}
.crown{position:absolute;top:-8px;right:-2px;font-style:normal}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:12px;background:var(--bg);color:var(--ink);font-weight:900;font-size:18px;border:2px solid transparent}
.seg button.on{border-color:#0fb5a8;background:rgba(15,181,168,.16)}
.seg button:disabled{opacity:1;cursor:default}
.hint{font-size:13px;opacity:.65;margin-top:10px;font-weight:700}
.mc{background:linear-gradient(160deg,#171a4a,#0e1030);color:#fff;border-radius:24px;padding:16px;box-shadow:0 10px 30px rgba(14,16,48,.35)}
.meta{text-align:center;font-size:13px;opacity:.75;margin-bottom:10px;font-weight:700}
.vs{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pl{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;transition:.25s;font-weight:700;font-size:14px;min-width:0}
.pl .n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.on{background:rgba(255,255,255,.1);box-shadow:0 0 0 2px var(--c)}
.pl.x{--c:#ff3d81}.pl.o{--c:#1e8bff}
.sc{font:400 34px/1 'Lalezar'}
.mk{font:900 13px 'Cairo';color:var(--c)}
.mid{font:400 22px 'Lalezar';opacity:.6}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px auto 6px;width:min(100%,340px);direction:ltr}
.cell{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.07);display:grid;place-items:center;padding:17%;transition:background .15s}
.cell:not(:disabled):active{background:rgba(255,255,255,.2)}
.cell:disabled{cursor:default}
.cell svg{width:100%;height:100%;fill:none;stroke-width:5;stroke-linecap:round;animation:draw .25s}
.cell.x svg{stroke:#ff3d81}.cell.o svg{stroke:#1e8bff}
.cell.win{background:rgba(255,210,63,.22);box-shadow:inset 0 0 0 2px #ffd23f}
@keyframes draw{from{transform:scale(.3);opacity:0}}
.stat{text-align:center;font-weight:900;font-size:16px;min-height:26px;margin-top:8px}
.react{display:flex;gap:10px;justify-content:center}
.rx{flex:1;max-width:160px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;font-size:30px;color:var(--ink);display:flex;flex-direction:column;align-items:center;line-height:1}
.rx small{font:700 12px 'Cairo';min-height:14px;margin-top:4px}
.rx:disabled{opacity:.5}
.rh{font-weight:900;margin:10px 0 4px;font-size:14px;opacity:.7}
.mr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;font-size:13px;font-weight:700}
.mr.live{background:rgba(15,181,168,.16)}
.mr .t{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.mr .t.w{color:#0fb5a8}
.mr b{font:400 18px 'Lalezar';direction:ltr}
.mr .st{font-style:normal;font-size:11px;padding:3px 8px;border-radius:99px;background:var(--bg)}
.champ{text-align:center;padding:30px 16px;background:linear-gradient(160deg,#ffd23f,#ff7a1a);color:#3a1d00;border-radius:26px;display:flex;flex-direction:column;align-items:center;gap:8px}
.champ h2{font:400 36px 'Lalezar'}
#modal{position:fixed;inset:0;z-index:15;background:rgba(10,5,25,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
#modal.on{display:flex}
.mbox{background:var(--card);color:var(--ink);border-radius:24px;padding:22px;width:min(100%,400px);display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.mbox h3{font:400 28px 'Lalezar'}
.mbox p{font-weight:700;line-height:1.7;font-size:14px}
.inp{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 17px 'Cairo';outline:none}
.inp:focus{border-color:#0fb5a8}
.pe{display:flex;align-items:center;gap:14px}
.pick{cursor:pointer;flex:none}
.pcol{flex:1;display:flex;flex-direction:column;gap:6px}
.pcol small{opacity:.65;font-weight:700}
.mrow{display:flex;gap:10px}.mrow .btn{flex:1}
.saybox{min-height:46px;margin-top:10px;display:flex;align-items:center;justify-content:center}
.say{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:6px 14px 6px 10px;border-radius:99px;font-weight:700;font-size:14px;animation:draw .25s}
.say b{color:#ffd23f}
.quick{display:flex;gap:8px;margin-top:10px}
.quick button{flex:1;padding:11px 4px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font:900 15px 'Cairo';border:1px solid rgba(255,255,255,.18);transition:.12s}
.quick button:active{background:rgba(255,255,255,.25);transform:translateY(2px)}
#wTitle{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt{display:flex;align-items:center;gap:14px}
.lb{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;font:400 64px/1 'Lalezar';color:#fff;background:linear-gradient(135deg,#ff7a1a,#ff3d6e);box-shadow:0 7px 0 rgba(0,0,0,.2);flex:none}
.lm b{display:block;font-size:20px}.lm span{opacity:.65;font-weight:700;font-size:13px}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3d6e,#ffb02e);border-radius:99px;transition:width .25s linear}
#tm{text-align:center;font-weight:900;font-size:14px;margin-top:6px}
.wf{display:flex;flex-direction:column;gap:10px}
.wr{display:flex;align-items:center;gap:10px}
.wl{width:88px;flex:none;font-weight:900;font-size:14px;color:var(--c);display:flex;align-items:center;gap:6px}
.wl i{font-style:normal;font-size:18px}
.wi{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 17px 'Cairo';outline:none}
.wi:focus{border-color:var(--c)}.wi:disabled{opacity:.7}
.ph2{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:900}
.rt{margin-inline-start:auto;font:400 30px 'Lalezar'}.rt small{font-size:16px;color:#21c07a}
.ar{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.ac{width:78px;flex:none;font-weight:900;color:var(--c)}
.aw{flex:1;font-weight:700;font-size:15px;min-width:0;word-break:break-word}
.aw small{display:block;font-size:11px;opacity:.7}
.aw.e,.aw.l,.aw.x{opacity:.6}
.ap{min-width:34px;text-align:center;padding:4px 0;border-radius:10px;font:400 18px 'Lalezar';color:#fff}
.ap.p10{background:#21c07a}.ap.p5{background:#ffb02e}.ap.p0{background:#ff4d5e}
.warn{background:rgba(255,176,46,.18);border:1px solid #ffb02e;border-radius:14px;padding:10px 14px;font-weight:700;font-size:13px}
.spin{display:inline-block;font-size:40px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cb{padding:9px 12px;border-radius:12px;background:var(--bg);color:var(--ink);font-weight:900;border:2px solid transparent;font-size:14px;opacity:.5}
.cb.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);opacity:1}
.cb:disabled{cursor:default}
.ob{padding:4px 10px;border-radius:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:700 11px 'Cairo';flex:none}
.ob.done{border:0;background:none;opacity:.8}
.ar{animation:draw .3s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:18;overflow:hidden}
.fe{position:absolute;bottom:70px;font-size:42px;animation:rise 2.4s ease-out forwards}
@keyframes rise{to{transform:translateY(-55vh) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){#home{max-width:900px;margin:0 auto}}

/* ---------- SPY ---------- */
#sp{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;padding-top:var(--safeT);
  background:radial-gradient(circle at 90% 0,rgba(106,76,255,.25),transparent 40%),radial-gradient(circle at 0 100%,rgba(255,61,129,.18),transparent 45%),var(--bg)}
#sp.show{display:flex}
#sBody{flex:1;overflow:auto;padding:16px 14px 24px;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#sCode{font:900 15px/1 'Cairo';direction:ltr;letter-spacing:.2em;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
#sCode:empty{display:none}
#sDock{flex:none;display:flex;gap:10px;padding:10px 14px calc(12px + var(--safeB));width:100%;max-width:560px;margin:0 auto;border-top:1px solid var(--line);background:var(--bg)}
#sDock:empty{display:none}
#sDock .btn{flex:1;padding:14px 8px}
#sm{position:fixed;inset:0;z-index:16;background:rgba(10,5,25,.6);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
#sm.on{display:flex}
#smb{max-height:92vh;overflow:auto}
.btn.pp{background:linear-gradient(135deg,#6a4cff,#ff3d81)}
.btn.gn{background:linear-gradient(135deg,#21c07a,#0fb5a8)}
.btn.gr{background:#8b8799;color:#ece9f5;box-shadow:none}
.role{font:400 44px/1.25 'Lalezar';text-align:center;padding:26px 12px;border-radius:22px;background:linear-gradient(135deg,#ff7a1a,#ff3d6e);color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.2);word-break:break-word}
.role.spyr{background:linear-gradient(135deg,#1c1250,#5a2ba8)}
.qa{background:var(--bg);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.qa.live{box-shadow:0 0 0 2px #6a4cff}
.qh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px}
.qq,.qr{display:flex;align-items:center;gap:6px;word-break:break-word}
.qr{color:#0fb5a8}
.qbox{background:var(--bg);border-radius:14px;padding:12px;font-weight:700;line-height:1.7}
.qbox small{opacity:.65;display:block}
.ob.big{padding:7px 14px;font-size:14px}
.vl{display:flex;flex-direction:column;gap:10px}
.vb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg);color:var(--ink);font:900 17px 'Cairo';border:2px solid transparent;text-align:right}
.vb.on{border-color:#6a4cff;background:rgba(106,76,255,.16)}
.vb:disabled{cursor:default}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.op{padding:14px 6px;border-radius:14px;background:var(--bg);color:var(--ink);font:900 16px 'Cairo';border:2px solid transparent}
.op.on{border-color:#6a4cff;background:rgba(106,76,255,.16)}
.cdn{font:400 150px/1 'Lalezar';text-align:center;background:linear-gradient(120deg,#ff3d81,#ffb02e);-webkit-background-clip:text;background-clip:text;color:transparent}
.recb{display:flex;align-items:center;gap:8px;font-weight:900;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:#ff3d6e;animation:pop 1s ease-in-out infinite}
.ghint{line-height:1.9;font-size:14px}
.kick{position:absolute;top:-6px;left:-4px;width:24px;height:24px;border-radius:50%;background:#ff4d5e;color:#fff;font:900 13px/1 'Cairo';z-index:3}
.mr .kick{position:static;width:auto;height:auto;border-radius:10px;padding:4px 10px;font-size:11px;flex:none}
/* ---------- ADMIN + CHAT ---------- */
.admin{position:relative}
.admin.nw::after{content:"";position:absolute;top:8px;left:12px;width:12px;height:12px;border-radius:50%;background:#ff3d6e;box-shadow:0 0 0 3px var(--btn)}
.bdg{background:#ff3d6e;color:#fff;border-radius:99px;font:900 13px/1 'Cairo';padding:4px 9px}
#adm,#chat{position:fixed;inset:0;display:none;flex-direction:column;padding-top:var(--safeT);
  background:radial-gradient(circle at 90% 0,rgba(106,76,255,.22),transparent 40%),radial-gradient(circle at 0 100%,rgba(15,181,168,.2),transparent 45%),var(--bg)}
#adm{z-index:8}#chat{z-index:9}
#adm.on,#chat.on{display:flex}
.tabs{display:flex;gap:8px;padding:10px 14px}
.tabs button{flex:1;padding:11px 4px;border-radius:14px;background:var(--card);color:var(--ink);font:900 14px 'Cairo';border:2px solid var(--line)}
.tabs button.on{border-color:#6a4cff;background:rgba(106,76,255,.16)}
#admBody,#chMsgs{flex:1;overflow:auto;padding:14px;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ibx{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:right;color:var(--ink);width:100%;font-family:inherit;flex:none}
.ibx .tx{flex:1;min-width:0}.ibx b{display:block;font-weight:900}
.ibx small{display:block;opacity:.65;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibx i{width:12px;height:12px;border-radius:50%;background:#ff3d6e;flex:none}
.chh{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(135deg,#1c1250,#3b1d86 60%,#5a2ba8);color:#fff}
.chh b{flex:1;font:400 24px/1.1 'Lalezar'}.chh b small{display:block;font:700 12px 'Cairo';opacity:.75}
.chh .xi{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;font-weight:700;font-size:15px;line-height:1.7;word-break:break-word;animation:draw .2s}
.bub.me{align-self:flex-start;background:linear-gradient(135deg,#0fb5a8,#1e8bff);color:#fff;border-start-start-radius:6px}
.bub.th{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-start-end-radius:6px}
.bub img{display:block;max-width:100%;max-height:260px;border-radius:12px}
.bub small{display:block;font-size:10px;opacity:.65;margin-top:2px}
.chbar{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + var(--safeB));border-top:1px solid var(--line);background:var(--card);width:100%}
.chbar textarea{flex:1;min-width:0;min-height:46px;max-height:120px;resize:none;border-radius:23px;padding:12px 16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px 'Cairo';outline:none}
.chbar textarea:focus{border-color:#6a4cff}
.cbtn{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6a4cff,#ff3d81);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.cbtn.g{background:var(--bg);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.cbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cbtn:active{transform:translateY(2px)}
#chRecBar{display:none;align-items:center;gap:12px;font-weight:900}
#chRecBar .rtx{flex:1;display:flex;align-items:center;gap:8px}

<script>
/* ===== إعدادات ===== */
// رقم الأدمن بالصيغة الدولية بدون + (غيّره لرقمك)
const ADMIN_WHATSAPP = "201000000000";

const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

/* ===== الوضع الليلي / النهاري ===== */
function setTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  store.set('theme', t);
}
setTheme(store.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#themeBtn').onclick = () =>
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

/* ===== تسجيل الدخول =====
   دلوقتي: الزرار بيدخّلك علطول.
   الجزء الجاي: هنربط Firebase Auth بجوجل هنا بدل enterApp(). */
function enterApp(){
  $('#login').classList.add('hide');
  $('#home').classList.add('show');
  store.set('in', '1');
}


/* ===== كلّم الأدمن ===== */


/* ===== الألعاب (الأجزاء الجاية) ===== */
let tt;
function toast(m, ms = 2200){
  const el = $('#toast'); el.textContent = m;
  el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), ms);
}
document.querySelectorAll('.tile').forEach(t => t.onclick = () => {
  const g = t.dataset.game;
  g === 'XO' ? openXO() : g.startsWith('إنسان') ? openWords() : g === 'الجاسوس' ? openSpy() : toast('لعبة ' + g + ' جاية في الجزء الجاي 🎮');
});

/* =====================================================
   XO — الجزء 2
   ===================================================== */
// الصق إعدادات مشروع Firebase هنا (Realtime Database)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCYGiT4j33DMGdWIXCY01Vyfyv3HJv0Iz0",
  authDomain: "together-e5e99.firebaseapp.com",
  databaseURL: "https://together-e5e99-default-rtdb.firebaseio.com",
  projectId: "together-e5e99",
  storageBucket: "together-e5e99.firebasestorage.app",
  messagingSenderId: "563658786726",
  appId: "1:563658786726:web:28d170b9a90ad1c9b0f167"
};

let db = null, offset = 0;
function initFB(){
  if (db) return true;
  if (typeof firebase === 'undefined' || !FIREBASE_CONFIG.databaseURL) return false;
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  db.ref('.info/serverTimeOffset').on('value', s => offset = s.val() || 0);
  return true;
}
const now = () => Date.now() + offset;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const av = (p, sz = 44) => p && p.photo
  ? `<img class="av" style="width:${sz}px;height:${sz}px" src="${esc(p.photo)}" alt="">`
  : `<span class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.45}px;background:hsl(${hue(p ? p.name : '?')} 65% 52%)">${esc((p && p.name || '?').trim().charAt(0))}</span>`;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---- الهوية والبروفايل (محفوظين على الجهاز) ---- */
let me = null; try { me = JSON.parse(store.get('profile') || 'null'); } catch(e){}
let uid = store.get('uid');
if (!uid) { uid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set('uid', uid); }
let ghost = false, isAdmin = false;

function modal(h){ $('#mbox').innerHTML = h; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

let tmpPhoto = '';
const phHTML = () => tmpPhoto ? av({photo: tmpPhoto}, 72) : `<span class="av ph" style="width:72px;height:72px;font-size:28px">📷</span>`;
function readPhoto(file, cb){
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 96;
    const s = Math.min(im.width, im.height);
    c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 96, 96);
    cb(c.toDataURL('image/jpeg', .75)); }; im.src = r.result; };
  r.readAsDataURL(file);
}
function profileModal(after){
  tmpPhoto = me && me.photo || '';
  modal(`<h3>${me ? 'تعديل البروفايل' : 'اكتب اسمك'}</h3>
    <div class="pe"><label class="pick"><span id="pv">${phHTML()}</span><input type="file" accept="image/*" id="pf" hidden></label>
    <div class="pcol"><input id="pn" class="inp" maxlength="16" placeholder="اسمك" value="${esc(me ? me.name : '')}"><small>الصورة اختيارية، دوس على الدايرة</small></div></div>
    <div class="mrow"><button class="btn" id="ps" type="button">حفظ</button><button class="btn ghost" id="pr" type="button">شيل الصورة</button></div><button class="btn red" id="plo" type="button">تسجيل خروج / تغيير الحساب</button>`);
  $('#pf').onchange = e => e.target.files[0] && readPhoto(e.target.files[0], d => { tmpPhoto = d; $('#pv').innerHTML = phHTML(); });
  $('#pr').onclick = () => { tmpPhoto = ''; $('#pv').innerHTML = phHTML(); };
  $('#plo').onclick = () => signOut();
  $('#ps').onclick = () => {
    const name = $('#pn').value.trim();
    if (!name) return toast('اكتب اسمك الأول');
    me = { name, photo: tmpPhoto };
    store.set('profile', JSON.stringify(me)); profSync();
    if (ref && code) ref.child('players/' + uid).update({ name: me.name, photo: me.photo });
    if (typeof wref !== 'undefined' && wref && wcode) wref.child('players/' + uid).update({ name: me.name, photo: me.photo });
    if (typeof sref !== 'undefined' && sref && scode) sref.child('players/' + uid).update({ name: me.name, photo: me.photo });

function move(i){

    const s = m.turn === 'a' ? 'a' : 'b';
    if ((s === 'a' ? m.a : m.b) !== uid || m.board[i] !== '-') return;
    const b = m.board.slice(0, i) + (s === 'a' ? 'X' : 'O') + m.board.slice(i + 1), w = winLine(b);

async function verify(items, L, review){
  if (!WORKER_URL || !auth || !auth.currentUser) throw new Error('no key');
  const r = await api({ action: 'verify', letter: disp(L), review: !!review, items: items.map(([c, w]) => ({ cat: CATS[c][0], word: w })) });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  return items.map((_, i) => !j.ok || j.ok[i] !== false);
}

/* ---- التصحيح: لاعب لاعب، والتكرار محسوب من إجابات الكل ---- */
function cellsOf(d){
  const L = d.letter, ids = Object.keys(d.players || {}), subs = d.sub || {}, cs = actCats(d.gc), cells = {}, cnt = {};
  ids.forEach(id => {
    const a = (subs[id] && subs[id].a) || [];
    cells[id] = cs.map(c => {
      const w = String(a[c] || '').trim(), n = norm(w), b = base(n); let r = 'ok';
      if (!n) r = 'e'; else if (b.charAt(0) !== L) r = 'l'; else if (!sane(n)) r = 'x';
      const k = kOf(c, b); if (r === 'ok') cnt[k] = (cnt[k] || 0) + 1;
      return { c, w, k, r };
    });
  });
  return { ids, cells, cnt };
}
function playerRes(x, id){
  const o = { w: [], r: [], p: [], t: 0, b: 0 };
  x.cells[id].forEach(cl => {
    let r = cl.r, p = 0;
    if (r === 'ok' && cache[cl.k] === false) r = 'x';
    if (r === 'ok') { if (x.cnt[cl.k] > 1) { r = 'd'; p = 5; } else p = 10; }
    o.w.push(cl.w); o.r.push(r); o.p.push(p); o.t += p;
  });
  return o;
}
function totals(res, ids, s0){
  const mx = Math.max(0, ...ids.map(i => res[i] ? res[i].t : 0)), scores = {};
  ids.forEach(id => { const r = res[id]; if (r) r.b = (mx > 0 && r.t === mx) ? 10 : 0; scores[id] = (s0[id] || 0) + (r ? r.t + r.b : 0); });
  return scores;
}
async function wGrade(){
  gLock = true;
  try {
    Object.assign(cache, W.vd || {});
    await wref.update({ state: 'grading', gcur: null, res: null, obj: null });
    const x = cellsOf(W), s0 = W.s0 || {}, res = {}; let ai = true;
    for (const id of x.ids) {
      await wref.update({ gcur: id });
      const need = {};
      x.cells[id].forEach(cl => { if (cl.r === 'ok' && !(cl.k in cache)) need[cl.k] = [cl.c, cl.w]; });
      const keys = Object.keys(need);
      if (keys.length) {
        try {
          const v = await verify(keys.map(k => need[k]), W.letter), up = {};
          keys.forEach((k, i) => { cache[k] = !!v[i]; up['vd/' + k] = !!v[i]; });
          await wref.update(up);
        } catch(e) { ai = false; }
      }
      res[id] = playerRes(x, id);
      await wref.child('res/' + id).set(res[id]);
      await sleep(900);
    }
    const ids = x.ids.filter(i => W.players && W.players[i]), scores = totals(res, ids, s0);
    const up = { state: 'results', ai, go: null, gcur: null, scores };
    ids.forEach(i => { if (res[i]) up['res/' + i + '/b'] = res[i].b; });
    await wref.update(up);
  } finally { gLock = false; }
}
async function wRecompute(){
  const x = cellsOf(W), res = {}; x.ids.forEach(id => res[id] = playerRes(x, id));
  const scores = totals(res, x.ids, W.s0 || {});
  await wref.update({ res, scores });
}
async function wObject(k){
  const mark = o => wref.child('obj/' + k).update(o);
  try {
    const [id, ix] = k.split('_'), r = W.res && W.res[id]; if (!r) return mark({ st: 2 });
    const c = actCats(W.gc)[+ix], w = r.w[+ix], key = kOf(c, base(norm(w)));
    let v; try { v = (await verify([[c, w]], W.letter, true))[0]; } catch(e) { return mark({ st: 2 }); }
    cache[key] = v; await wref.child('vd/' + key).set(v);
    await wRecompute(); await mark({ st: 1, v });
  } finally { delete objBusy[k]; }
}

    mr.onstop = () => {

$('#chMic').onclick = async () => {
  if (cr) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mt = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    const mr = new MediaRecorder(stream, mt ? { mimeType: mt, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
    const parts = []; mr.ondataavailable = x => x.data && x.data.size && parts.push(x.data);
    cr = { mr, drop: false, t0: Date.now(), mt: mr.mimeType || mt || 'audio/webm' };
    cr.iv = setInterval(() => { const s = Math.floor((Date.now() - cr.t0) / 1000); $('#chRt').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 500);
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); const c = cr; cr = null; clearInterval(c.iv);
      $('#chBar').style.display = 'flex'; $('#chRecBar').style.display = 'none';
      if (c.drop) return;
      try {
        const blob = new Blob(parts, { type: c.mt });

      } catch (e) { console.error(e); toast('فشل الفويس: ' + (e.code || e.message || e), 6000); }
    };
    mr.start(); $('#chRt').textContent = '0:00'; $('#chBar').style.display = 'none'; $('#chRecBar').style.display = 'flex';
  } catch (e) { toast('مش قادر يفتح المايك، اسمح بالمايك'); }

/* ---- إشعارات داخل التطبيق: صوت + اهتزاز + إشعار المتصفح ---- */
let actx = null;
function beep(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(); o.connect(g); g.connect(actx.destination);
    o.frequency.value = 880; g.gain.setValueAtTime(.15, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .3);
    o.start(); o.stop(actx.currentTime + .3);
  } catch (e) {}
}
function ping(t, b){
  beep(); try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
  try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(t, { body: b }); } catch (e) {}
}
if ('Notification' in window && Notification.permission === 'default') document.addEventListener('click', () => Notification.requestPermission(), { once: true });

/* ---- 🤖 مساعد XO للأدمن بس: لعب مثالي (minimax) ---- */
function aiBest(bd, me){
  const opp = me === 'X' ? 'O' : 'X', b = bd.split('');
  const W = b => { for (const [x, y, z] of LINES) if (b[x] !== '-' && b[x] === b[y] && b[y] === b[z]) return b[x]; return null; };
  function mm(b, t, d, al, be){
    const w = W(b); if (w) return w === me ? 10 - d : d - 10;
    if (!b.includes('-')) return 0;
    let best = t === me ? -99 : 99;
    for (let i = 0; i < 9; i++) if (b[i] === '-') {
      b[i] = t; const v = mm(b, t === me ? opp : me, d + 1, al, be); b[i] = '-';
      if (t === me) { best = Math.max(best, v); al = Math.max(al, v); } else { best = Math.min(best, v); be = Math.min(be, v); }
      if (be <= al) break;
    }
    return best;
  }
  const order = [4, 0, 2, 6, 8, 1, 3, 5, 7].filter(i => b[i] === '-');
  if (order.length === 9) return 4;
  let bv = -99, cand = [];
  for (const i of order) { b[i] = me; const v = mm(b, opp, 1, -99, 99); b[i] = '-'; if (v > bv) { bv = v; cand = [i]; } else if (v === bv) cand.push(i); }
  if (cand.length < 2) return cand[0];
  // بين الحركات المتساوية: اختار اللي بتحط الخصم في أكتر فخاخ (ردود بتخسّره)
  let pick = cand[0], bt = -1;
  for (const i of cand) {
    b[i] = me; let n = 0;
    for (let j = 0; j < 9; j++) if (b[j] === '-') { b[j] = opp; if (mm(b, me, 2, -99, 99) > 0) n++; b[j] = '-'; }
    b[i] = '-'; if (n > bt) { bt = n; pick = i; }
  }
  return pick;
}
